<style>

  .emb .tit { font-weight: 700; font-size: 34px; color: #f2f3f5; margin-bottom: 6px; }
  .emb .d { font-weight: 500; font-size: 34px; line-height: 1.32; color: #dbdee1; }
  .emb .resp { font-size: 26px; color: #949ba4; margin-bottom: 6px; }

  .efem { font-size: 25px; color: #949ba4; margin-top: 10px; }
  .efem b { color: #00a8fc; font-weight: 500; }
  .digitando { flex: 0 0 auto; height: 0; overflow: hidden; padding: 0 34px; font-size: 26px; color: #b5bac1; font-weight: 700; }
  .entrada { flex: 0 0 auto; margin: 6px 22px 22px; height: 96px; display: flex; align-items: center; gap: 16px; }
  .entrada .mais { width: 76px; height: 76px; border-radius: 50%; background: #383a40; display: grid; place-items: center; font-size: 46px; color: #b5bac1; }
  .entrada .caixa { flex: 1; height: 96px; border-radius: 48px; background: #383a40; display: flex; align-items: center; padding: 0 30px;
    font-size: 34px; color: #949ba4; white-space: nowrap; overflow: hidden; }

  .entrada .enviar { width: 86px; height: 86px; border-radius: 50%; background: #5865f2; display: grid; place-items: center; font-size: 40px; }
  .cursor { display: inline-block; width: 3px; height: 40px; background: #dbdee1; vertical-align: -8px; margin-left: 3px; }
  .espaco { flex: 0 0 auto; height: 0; }
  /* teclado */
  #teclado { position: absolute; left: 0; right: 0; bottom: 0; height: 400px; background: #1b1c20; padding: 18px 10px; z-index: 5; }
  #veu { z-index: 6; } #gaveta { z-index: 7; } #veu2 { z-index: 8; } #folha { z-index: 9; } #toast { z-index: 10; }
  .fila { display: flex; justify-content: center; gap: 10px; margin-bottom: 14px; }
  .tecla { width: 82px; height: 74px; border-radius: 12px; background: #3a3c43; display: grid; place-items: center; font-size: 32px; color: #e8e8ea; }
  .tecla.larga { width: 460px; } .tecla.on { background: #6d7280; transform: translateY(-6px); }
  /* lista de canais */
  #veu, #veu2 { position: absolute; inset: 0; background: #000; opacity: 0; }

  /* folha de baixo */
  #folha { position: absolute; left: 0; right: 0; bottom: 0; background: #232428; border-radius: 34px 34px 0 0; padding: 18px 0 34px; }
  #folha .alca { width: 90px; height: 10px; border-radius: 5px; background: #4e5058; margin: 0 auto 18px; }
  #folha .ftit { font-size: 30px; font-weight: 700; color: #b5bac1; padding: 0 36px 14px; }

  #folha .emojis span.on { background: #5865f2; }
  /* notificacao */
  #toast { position: absolute; left: 24px; right: 24px; top: 20px; background: #1e1f22; border-radius: 28px; padding: 22px 26px;

  #toast img { width: 86px; height: 86px; border-radius: 50%; }
  #toast .tt { font-weight: 700; font-size: 32px; } #toast .tx { font-size: 30px; color: #c4c9ce; }

  #intro, #cta { position: absolute; left: 0; right: 0; text-align: center; }

    background: linear-gradient(90deg, #8fd3ff, #b79bff, #ffd1f5); -webkit-background-clip: text; color: transparent; }
  #intro .t2 { font-weight: 700; font-size: 44px; color: #c9ccff; margin-top: 20px; }
  .botao { display: inline-block; font-weight: 900; font-size: 64px; padding: 34px 70px; border-radius: 80px;
    background: linear-gradient(90deg, #5865f2, #8b5cf6); box-shadow: 0 20px 60px rgba(88,101,242,.55); }
  .l2 { font-weight: 700; font-size: 50px; margin-top: 44px; color: #ffe27a; }
  .l3 { font-weight: 500; font-size: 40px; margin-top: 26px; color: #c9ccff; }
  #legenda { position: absolute; left: 50px; right: 50px; top: 1500px; text-align: center; font-weight: 900;
    font-size: 70px; line-height: 1.15; text-transform: uppercase; -webkit-text-stroke: 10px #0b0d1a; paint-order: stroke fill; }
  #legenda span { display: inline-block; margin: 0 9px; }
  #legenda span.agora { color: #ffd84d; }

    border: 6px solid rgba(255,255,255,.92); pointer-events: none; z-index: 50; opacity: 0; }
</style></head>
<body><div id="palco"></div>
<script>
const P = document.getElementById("palco");
let TL = null;
const clamp = (x) => Math.max(0, Math.min(1, x));
const easeOut = (x) => 1 - Math.pow(1 - x, 3);
const easeIO = (x) => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const h = (html) => { const d = document.createElement("div"); d.innerHTML = html.trim(); return d.firstElementChild; };
const sem = (s) => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9]/g, "");
const cenaDe = (id) => TL.cenas.find((c) => c.id === id);
// o instante em que a narracao diz a palavra (a n-esima que comeca assim)
function w(id, chave, n = 0, d = 0) {
  const c = cenaDe(id), k = sem(chave);
  const p = c.palavras.filter((x) => sem(x.texto).startsWith(k))[n];
  return (p ? p.t0 : c.inicio + (c.fim - c.inicio) / 2) + d;
}
const ini = (id) => cenaDe(id).inicio, fimFala = (id) => cenaDe(id).fim;

/* ---------------- gente e pecas ---------------- */
const CY = "cyron";
const G = { voce: ["You", "Y", "#5865f2", "#c9cdfb"], budi: ["Budi", "B", "#e0732f", "#f5b183"], mika: ["Mika", "M", "#d9488f", "#f39ac4"],
  yuki: ["Yuki", "K", "#2fa39a", "#86dcd5"], adm: ["Admin", "A", "#c9a227", "#f0d77a"] };
function msg(quem, { t = -1, hora = "Today at 7:35 PM", corpo = "", app = false, id = "" } = {}) {
  const ehCy = quem === CY, g = G[quem] || [];
  const av = ehCy ? '<div class="av"><img src="img/cyron-og.jpg"></div>' : `<div class="av" style="background:${g[2]}">${g[1]}</div>`;
  const nome = ehCy ? "CYRON" : g[0], cor = ehCy ? "#fff" : g[3];
  return `<div class="msg" data-t="${t}" ${id ? `id="${id}"` : ""}><div class="in">${av}<div class="cbody">
    <div class="linha1"><span class="nome" style="color:${cor}">${nome}</span>${ehCy || app ? '<span class="app">APP</span>' : ""}<span class="hora">${hora}</span></div>
    ${corpo}</div></div></div>`;
}
const txt = (s) => `<div class="txt">${s}</div>`;
function cartao(texto, { cor = "#5865f2", quem = "", selo = "", canto = "", baixo = "", resp = "", tit = "" } = {}) {
  return `<div class="emb" style="border-left-color:${cor}"><div class="e">${resp ? `<div class="resp">${resp}</div>` : ""}${tit ? `<div class="tit">${tit}</div>` : ""}
    <div class="d">${texto}</div>${baixo ? `<img class="baixo" src="${baixo}">` : ""}${quem ? `<div class="ass"><b>${quem}</b>${selo ? " · " + selo : ""} · ᶜʸʳᵒⁿ</div>` : ""}</div>
    ${canto ? `<img class="canto" src="${canto}">` : ""}</div>`;
}
function pagina(id, canal, msgs, { dm = false, entrada = true, placeholder = "" } = {}) {
  return `<div class="pag" id="pg-${id}"><div class="cab"><span class="menu">☰</span>${dm ? '<span class="h">@</span>' : '<span class="h">#</span>'}${canal}</div>
    <div class="rolo">${msgs.join("")}</div><div class="digitando"></div>
    ${entrada ? `<div class="entrada"><span class="mais">+</span><span class="caixa"><span class="dig"></span><span class="ph">${placeholder || (dm ? "Message @" + canal : "Message #" + canal)}</span><span class="cursor"></span></span><span class="enviar">➤</span></div>` : ""}
    <div class="espaco"></div></div>`;
}

/* ---------------- a historia, presa as palavras da narracao (versao em ingles) ---------------- */
const EV = { paginas: [], rotulos: [], gavetas: [], teclados: [], digitar: [], digitando: [], folhas: [], toasts: [], toques: [], trocas: [] };

function montarHistoria() {
  const envio = fimFala("escrever") + 0.35;
  const welcome = txt('👋 <span style="color:#00a8fc">Budi</span> · 🇮🇩 Bahasa Indonesia<br>Just arrived! Write in your language and I\'ll translate it for everyone.');
  const minhaFrase = "Anyone joining the bear at 8pm? 🐻";
  const antes = [msg("adm", { hora: "Today at 7:05 PM", corpo: txt("Good evening, alliance! Bear trap tonight at 8pm 🐻") }),
    msg("yuki", { app: true, hora: "Today at 7:12 PM", corpo: cartao("I'll be a little late today 🙏", { cor: "#2fa39a", quem: "Yuki", selo: "🇯🇵 → 🇬🇧" }) })];
  const tResp = w("resposta", "reaches"), tMika = w("figurinha", "sent"), tEmoji = w("figurinha", "emoji");
  const paginas = [
    pagina("chat-en", "chat-en", [...antes,
      msg(CY, { t: w("boasvindas", "announces"), hora: "Today at 7:35 PM", corpo: welcome }),
      msg("voce", { t: envio + 0.1, hora: "Today at 7:36 PM", corpo: txt(minhaFrase) }),
      msg("budi", { t: tResp, app: true, hora: "Today at 7:37 PM", corpo: cartao("Let's go! I'm in 🐻🔥", { cor: "#e0732f", quem: "Budi", selo: "🇮🇩 → 🇬🇧", resp: "↪ You: Anyone joining the bear at 8pm?" }) }),
      msg("mika", { t: tMika, app: true, hora: "Today at 7:38 PM", corpo: cartao("🎨 CYRON GG", { cor: "#d9488f", quem: "Mika", selo: "🇯🇵 → 🇬🇧", canto: "img/gg.png" }) }),
      msg("budi", { t: tEmoji, app: true, hora: "Today at 7:38 PM", corpo: cartao("lol nice", { cor: "#e0732f", quem: "Budi", selo: "🇮🇩 → 🇬🇧", baixo: "img/amei.png" }) })]),
    ...[["chat-id", "Ada yang ikut beruang jam 8 malam? 🐻", "🇬🇧 → 🇮🇩", "Halo semua! Siap untuk malam ini?"],
      ["chat-zh", "有人晚上8点打熊吗？🐻", "🇬🇧 → 🇨🇳", "大家好！今晚准备好了吗？"],
      ["chat-es", "¿Alguien se une al oso a las 8 pm? 🐻", "🇬🇧 → 🇪🇸", "¡Hola a todos! ¿Listos para esta noche?"]].map(([c, t, s, oi]) => pagina(c, c, [
        msg("adm", { app: true, hora: "Today at 7:05 PM", corpo: cartao(oi, { cor: "#c9a227", quem: "Admin", selo: s }) }),
        msg("voce", { t: envio + 0.6, app: true, hora: "Today at 7:36 PM", corpo: cartao(t, { cor: "#5865f2", quem: "You", selo: s }) })])),
    pagina("general", "general", [
      msg("adm", { hora: "Today at 6:20 PM", corpo: txt("Remember to donate to the alliance today 💎") }),
      msg("budi", { hora: "Today at 6:31 PM", corpo: txt("Siap! 💪") }),
      msg("yuki", { hora: "Today at 7:40 PM", id: "msg-yuki", corpo: txt("明日のイベントは何時からですか？") + '<div class="reac"><span>👍 2</span><span class="eu" id="reac-gb" style="display:none">🇬🇧 1</span></div>' })]),
    pagina("dm", "CYRON", [
      msg(CY, { hora: "Yesterday at 9:02 PM", corpo: txt("Hi! I'm CYRON 👋 React with a flag on any message and I'll send you the translation here.") }),
      msg(CY, { t: w("bandeira", "dms"), hora: "Today at 7:40 PM", corpo: cartao("What time does tomorrow's event start?", { tit: "🇬🇧 Translation", cor: "#5865f2" }) + '<div class="efem">Yuki in <b>#general</b></div>' }),
      msg(CY, { t: w("evento", "reminds"), hora: "Today at 7:50 PM", corpo: `<div class="emb" style="border-left-color:#f0a33a"><div class="e"><div class="tit">⏰ Bear Trap</div><div class="d">Starts in 10 minutes! You signed up.</div></div><img class="canto" src="img/cyron-og.jpg" style="border-radius:12px"></div>` })],
      { dm: true }),
    pagina("events", "events", [
      msg(CY, { hora: "Today at 12:00 PM", corpo: cartao("⚔️ Saturday at 3:00 PM <span style='color:#949ba4'>(your time zone)</span><br>👥 34 signed up", { tit: "Alliance War", cor: "#e04f4f" }) }),
      msg(CY, { hora: "Today at 7:35 PM", corpo: cartao("🕗 Today at 8:00 PM <span style='color:#949ba4'>(your time zone)</span><br>⏳ starts in 25 minutes<br>👥 11 signed up", { tit: "🐻 Bear Trap", cor: "#f0a33a" }) +
        '<div class="bts"><span class="bt" id="bt-insc">✅ Sign up</span></div>' })], { entrada: false }),
    pagina("cyron", "⚙️-cyron", [
      msg(CY, { hora: "Today at 7:00 PM", corpo: cartao(`<span id="f-her">🟢</span> 🃏 Heroes popping up in chat<br>🟢 ⚔️ Duel calls in chat<br>🟢 🔔 Pick-your-language reminder<br>🟢 💬 Per-message translator<br>🟢 ⬆️ Levels and XP<br>🟢 👋 Room welcomes<br><br><span style="color:#ffe27a">🧪 CYRON in beta: Alliance plan unlocked</span>`, { tit: "🧩 Features", cor: "#5865f2" }) +
        '<div class="sel"><span>Turn a feature on or off</span><span>▾</span></div>' })], { entrada: false }),
    // o celular do Budi
    pagina("b-idioma", "idioma-language", [
      msg(CY, { hora: "Today at 10:00 AM", corpo: cartao("Pick once and the server talks to you in your language.", { tit: "🌐 Pick your language" }) +
        '<div class="sel"><span>Select your language</span><span>▾</span></div>' }),
      msg(CY, { t: w("entrada", "thats"), hora: "Today at 7:34 PM", corpo: cartao("✅ Done! Your language is now 🇮🇩 Bahasa Indonesia.<br>Your room: <span style='color:#00a8fc'>#chat-id</span>", { cor: "#248046" }) + '<div class="efem">👁 Only you can see this message</div>' })]),
    pagina("b-avisos", "announcements", [
      msg("adm", { hora: "Yesterday at 5:00 PM", corpo: txt("📣 Bear every day at 8pm. Join if you can!") }),
      msg("adm", { hora: "Today at 6:00 PM", corpo: txt("📣 Alliance war on Saturday, 3pm UTC. Everyone online!") }),
      msg(CY, { hora: "Today at 6:00 PM", corpo: '<div class="sel"><span>🌐 Read in your language</span><span>▾</span></div>' }),
      msg(CY, { t: w("aviso", "copy"), hora: "Today at 7:41 PM", corpo: cartao("📣 Perang aliansi hari Sabtu, pukul 15.00 UTC. Semua online!", { cor: "#5865f2", tit: "🇮🇩 Bahasa Indonesia" }) + '<div class="efem">👁 Only you can see this message</div>' })], { entrada: false }),
  ];
  const F = document.getElementById("fone");
  paginas.forEach((p) => F.appendChild(h(p)));

  const seu = "📱 Your phone 🇬🇧", doBudi = "📱 Budi's phone 🇮🇩";
  const pg = (t, id, modo = "corte") => EV.paginas.push({ t, id, modo });
  const rot = (t, texto, budi = false) => EV.rotulos.push({ t, texto, budi });
  const toque = (t, alvo, segura = 0) => EV.toques.push({ t, alvo, segura });
  const gaveta = (abre, toca, alvo) => { EV.gavetas.push({ abre, toca, fecha: toca === null ? null : toca + 0.25, alvo });
    toque(abre - 0.12, ".pag.atual .menu"); if (toca !== null) { toque(toca, "#ch-" + alvo); pg(toca + 0.05, alvo); } };
  const folha = (abre, fecha, html, opcao) => EV.folhas.push({ abre, fecha, html, opcao });
  const troca = (t, sel, fn) => EV.trocas.push({ t, sel, fn });

  // intro: o seu celular entra quando ela fala do servidor
  pg(-1, "chat-en"); rot(-1, seu);
  // entrada (celular do Budi)
  pg(ini("entrada") - 0.1, "b-idioma", "troca"); rot(ini("entrada") - 0.1, doBudi, true);
  const tMenu = w("entrada", "menu"), tEsc = w("entrada", "bahasa");
  toque(tMenu, "#pg-b-idioma .sel");

    <div class="op">🇨🇳 中文</div><div class="op">🇯🇵 日本語</div><div class="op">🇹🇭 ไทย</div>`, { t: tEsc, sel: "#op-id" });

  // boas-vindas: volta para o seu celular; a lista mostra a sala nova
  pg(ini("boasvindas") - 0.1, "chat-en", "troca"); rot(ini("boasvindas") - 0.1, seu);
  const tAbre = w("boasvindas", "opens");
  EV.gavetas.push({ abre: tAbre, toca: null, fecha: w("boasvindas", "look") - 0.1, alvo: null }); toque(tAbre - 0.12, ".pag.atual .menu");
  troca(tAbre + 0.6, "#ch-chat-id", (e, d) => { e.style.display = d ? "flex" : "none"; });
  // escrever

  // bandeira: segura o dedo, escolhe a bandeira, a notificacao chega, abre o privado

  const tSeg = w("bandeira", "hold"), tBr = w("bandeira", "british"), tPriv = w("bandeira", "dms");
  toque(tSeg, "#msg-yuki .txt", 0.7);
  folha(tSeg + 0.7, tBr + 0.3, `<div class="ftit">Add reaction</div><div class="emojis"><span>👍</span><span>❤️</span><span>😂</span><span>😮</span>
    <span id="r-gb">🇬🇧</span><span>🇧🇷</span><span>🇯🇵</span><span>🇮🇩</span></div><div class="op">↩️ Reply</div><div class="op">📋 Copy text</div><div class="op">🔗 Copy message link</div>`,
    { t: tBr, sel: "#r-gb" });
  toque(tBr, "#r-gb");
  troca(tBr + 0.35, "#reac-gb", (e, d) => { e.style.display = d ? "inline-block" : "none"; });
  const toastBand = { de: tPriv, ate: tPriv + 1.6, toque: tPriv + 1.25, html: '<img src="img/cyron-og.jpg"><div><div class="tt">CYRON</div><div class="tx">🇬🇧 Translation: What time does tomorrow\'s…</div></div>' };
  EV.toasts.push(toastBand); toque(toastBand.toque, "#toast"); pg(toastBand.toque + 0.1, "dm", "troca");
  // aviso (celular do Budi)
  pg(ini("aviso") - 0.15, "b-avisos", "troca"); rot(ini("aviso") - 0.15, doBudi, true);
  const tToca = w("aviso", "taps"), tEsc3 = w("aviso", "picks");
  toque(tToca, "#pg-b-avisos .sel");
  folha(tToca + 0.15, tEsc3 + 0.3, `<div class="ftit">🌐 Read in your language</div>
    <div class="op">🇬🇧 English</div><div class="op">🇪🇸 Español</div><div class="op">🇧🇷 Português</div><div class="op" id="op-id2">🇮🇩 Bahasa Indonesia</div><div class="op">🇨🇳 中文</div><div class="op">🇹🇭 ไทย</div>`,
    { t: tEsc3, sel: "#op-id2" });
  toque(tEsc3, "#op-id2");
  // evento (seu celular)
  pg(ini("evento") - 0.15, "events", "troca"); rot(ini("evento") - 0.15, seu);
  const tIns = w("evento", "sign"), tLem = w("evento", "reminds");
  toque(tIns, "#bt-insc");
  troca(tIns + 0.12, "#bt-insc", (e, d) => { e.textContent = d ? "✅ Signed up · 12" : "✅ Sign up"; e.className = d ? "bt azul" : "bt"; });
  const toastEv = { de: tLem, ate: tLem + 1.7, toque: tLem + 1.3, html: '<img src="img/cyron-og.jpg"><div><div class="tt">CYRON</div><div class="tx">⏰ Bear Trap starts in 10 minutes!</div></div>' };
  EV.toasts.push(toastEv); toque(toastEv.toque, "#toast"); pg(toastEv.toque + 0.1, "dm", "troca");
  // painel
  gaveta(w("painel", "control"), w("painel", "channel"), "cyron");
  const tMen = w("painel", "menu"), tHer = w("painel", "heroes");
  toque(tMen, "#pg-cyron .sel");
  folha(tMen + 0.15, tHer + 0.3, `<div class="ftit">Turn a feature on or off</div><div class="op" id="op-her">🃏 Heroes popping up in chat</div>
    <div class="op">⚔️ Duel calls in chat</div><div class="op">🔔 Pick-your-language reminder</div><div class="op">💬 Per-message translator</div><div class="op">⬆️ Levels and XP</div><div class="op">👋 Room welcomes</div>`,
    { t: tHer, sel: "#op-her" });
  toque(tHer, "#op-her");
  troca(tHer + 0.35, "#f-her", (e, d) => { e.textContent = d ? "⚪" : "🟢"; });
  EV.paginas.sort((a, b) => a.t - b.t); EV.rotulos.sort((a, b) => a.t - b.t);
}

function montar(tl) {
  TL = tl;
  [["#3b4bff", 700, 300, 200], ["#a24bff", 600, 760, 1250], ["#00b3ff", 500, 120, 1500]].forEach(([c, s, x, y], i) => {
    const b = h(`<div class="luz" style="background:${c};width:${s}px;height:${s}px;left:${x - s / 2}px;top:${y - s / 2}px"></div>`); b.dataset.i = i; P.appendChild(b); });
  P.appendChild(h('<div id="etiqueta"><span></span></div>'));
  P.appendChild(h('<div id="fone"></div>'));
  montarHistoria();
  const F = document.getElementById("fone");
  // teclado
  const filas = ["qwertyuiop", "asdfghjkl", "zxcvbnm"].map((f) => `<div class="fila">${[...f].map((k) => `<span class="tecla" data-k="${k}">${k}</span>`).join("")}</div>`).join("");
  F.appendChild(h(`<div id="teclado">${filas}<div class="fila"><span class="tecla">123</span><span class="tecla larga" data-k=" ">space</span><span class="tecla">↵</span></div></div>`));
  F.appendChild(h('<div id="veu"></div>'));
  const canais = [["WELCOME", ["idioma-language"]], ["CHAT", ["chat-en", "chat-id", "chat-zh", "chat-es"]], ["ALLIANCE", ["announcements", "events", "general"]], ["ADMIN", ["⚙️-cyron"]]];
  F.appendChild(h(`<div id="gaveta"><div class="srv"><span class="icone">🔥</span>Phoenix Alliance</div>
    ${canais.map(([cat, chs]) => `<div class="cat">${cat}</div>${chs.map((c) => `<div class="ch" id="ch-${c === "⚙️-cyron" ? "cyron" : c}"><span class="h">#</span>${c}${c === "chat-id" ? ' <span class="novo">NEW</span>' : ""}</div>`).join("")}`).join("")}</div>`));
  F.appendChild(h('<div id="veu2"></div>'));
  F.appendChild(h('<div id="folha"><div class="alca"></div><div id="fconteudo"></div></div>'));
  F.appendChild(h('<div id="toast"></div>'));
  P.appendChild(h(`<div id="intro" style="top:250px"><img src="img/cyron-corpo.webp" style="height:820px"><div class="t1">CYRON<br>in action</div><div class="t2">Automatic translation on Discord</div></div>`));
  P.appendChild(h(`<div id="cta" style="top:330px"><img src="img/aceno.png" style="width:520px"><div style="margin-top:50px"><span class="botao">➕ Add CYRON</span></div>
    <div class="l2">✨ Free during the beta</div><div class="l3">22 languages · hicyron.github.io</div></div>`));
  P.appendChild(h('<div id="dedo"></div>'));
  P.appendChild(h('<div id="legenda"></div>'));
  medir();
}
// a altura de cada mensagem, para ela "empurrar" as outras ao chegar
function medir() { document.querySelectorAll(".msg").forEach((m) => { m.style.maxHeight = "none"; m.dataset.h = m.scrollHeight; }); }

function vis(e, op, ty = 0, sc = 1, tx = 0) { e.style.opacity = op; e.style.transform = `translate(${tx}px,${ty}px) scale(${sc})`; e.style.visibility = op <= 0.001 ? "hidden" : "visible"; }
const ultimo = (lista, t) => { let r = null; for (const x of lista) if (x.t <= t) r = x; return r; };
const abertura = (t, a, f, dur = 0.32) => f == null ? easeOut(clamp((t - a) / dur)) : Math.min(easeOut(clamp((t - a) / dur)), 1 - easeOut(clamp((t - f) / dur)));

function render(t) {
  document.querySelectorAll(".luz").forEach((b) => { const i = +b.dataset.i; b.style.transform = `translate(${Math.sin(t * .4 + i * 2) * 60}px,${Math.cos(t * .33 + i) * 50}px)`; });
  const F = document.getElementById("fone");
  // qual pagina esta na tela (e a anterior, durante a troca de celular)
  const atual = ultimo(EV.paginas, t), idx = EV.paginas.indexOf(atual), antes = EV.paginas[idx - 1];
  const kTroca = atual.modo === "troca" ? easeOut(clamp((t - atual.t) / 0.35)) : 1;
  F.querySelectorAll(".pag").forEach((p) => {
    const id = p.id.slice(3); p.classList.toggle("atual", id === atual.id);
    if (id === atual.id) { p.style.zIndex = 2; vis(p, kTroca, (1 - kTroca) * 40); }
    else if (antes && id === antes.id && kTroca < 1) { p.style.zIndex = 1; vis(p, 1); }
    else vis(p, 0);
  });
  // mensagens chegando: crescem de altura e empurram as de cima
  F.querySelectorAll(".msg").forEach((m) => { const tm = +m.dataset.t, alt = +m.dataset.h || 200;
    if (tm < 0) { m.style.maxHeight = "none"; m.style.opacity = 1; return; }
    const k = easeIO(clamp((t - tm) / 0.4)); m.style.maxHeight = (alt * k) + "px"; m.style.opacity = clamp((t - tm) / 0.3); });
  // "fulano esta digitando..."
  F.querySelectorAll(".pag").forEach((p) => { const d = p.querySelector(".digitando"); const id = p.id.slice(3);
    const ev = EV.digitando.find((x) => x.pg === id && t >= x.de - 0.2 && t <= x.ate + 0.2);
    const k = ev ? abertura(t, ev.de, ev.ate, 0.2) : 0; d.style.height = (k * 46) + "px";
    if (ev) d.textContent = `${ev.quem} is typing${".".repeat(1 + Math.floor(t * 3) % 3)}`; });
  // texto sendo digitado e enviado
  let teclaOn = null;
  F.querySelectorAll(".pag").forEach((p) => { const id = p.id.slice(3), cx = p.querySelector(".caixa"); if (!cx) return;
    const ev = EV.digitar.find((x) => x.pg === id && t >= x.de && t < x.envia + 0.05); const dig = cx.querySelector(".dig"), ph = cx.querySelector(".ph");
    const letras = ev ? [...ev.texto] : [];
    const n = ev ? Math.round(letras.length * clamp((t - ev.de) / (ev.ate - ev.de))) : 0;
    dig.textContent = letras.slice(0, n).join(""); ph.style.display = n ? "none" : "inline";
    const en = p.querySelector(".enviar"); if (en) en.style.opacity = n ? 1 : 0.25;
    if (ev && n > 0 && n < letras.length && t < ev.ate) teclaOn = sem(letras[n - 1]) || " ";
    p.querySelector(".cursor").style.opacity = (Math.floor(t * 3) % 2 === 0 && (ev || p.classList.contains("atual"))) ? 1 : 0; });
  // teclado
  const tk = Math.max(0, ...EV.teclados.map((x) => abertura(t, x.abre, x.fecha, 0.3)));
  const tec = document.getElementById("teclado"); tec.style.transform = `translateY(${(1 - tk) * 420}px)`; tec.style.visibility = tk > 0.001 ? "visible" : "hidden";
  F.querySelectorAll(".pag.atual .espaco").forEach((e) => { e.style.height = (tk * 400) + "px"; });
  tec.querySelectorAll(".tecla").forEach((k) => k.classList.toggle("on", teclaOn !== null && k.dataset.k === teclaOn.slice(0, 1)));
  // lista de canais
  let gk = 0, gev = null;
  for (const g of EV.gavetas) { const k = abertura(t, g.abre, g.fecha, 0.32); if (k > gk) { gk = k; gev = g; } }
  const gav = document.getElementById("gaveta"); gav.style.transform = `translateX(${-(1 - gk) * 100}%)`; gav.style.visibility = gk > 0.001 ? "visible" : "hidden";
  document.getElementById("veu").style.opacity = gk * 0.55;
  gav.querySelectorAll(".ch").forEach((c) => { const id = c.id.slice(3);
    c.classList.toggle("atual", id === (atual.id === "cyron" ? "cyron" : atual.id) && !(gev && gev.toca !== null && t >= gev.toca));
    c.classList.toggle("alvo", !!(gev && gev.alvo === id && gev.toca !== null && t >= gev.toca - 0.1)); });
  // folha de baixo (menus e reacoes)
  let fk = 0, fev = null;
  for (const f of EV.folhas) { const k = abertura(t, f.abre, f.fecha, 0.3); if (k > fk) { fk = k; fev = f; } }
  const fo = document.getElementById("folha"), fc = document.getElementById("fconteudo");
  if (fev && fc.dataset.de !== String(fev.abre)) { fc.dataset.de = String(fev.abre); fc.innerHTML = fev.html; }
  fo.style.transform = `translateY(${(1 - fk) * 105}%)`; fo.style.visibility = fk > 0.001 ? "visible" : "hidden";
  document.getElementById("veu2").style.opacity = fk * 0.5;
  if (fev && fev.opcao) { const o = fo.querySelector(fev.opcao.sel); if (o) o.classList.toggle("on", t >= fev.opcao.t); }
  // notificacao
  let nk = 0, nev = null;
  for (const n of EV.toasts) { const k = abertura(t, n.de, n.ate, 0.35); if (k > nk) { nk = k; nev = n; } }
  const to = document.getElementById("toast");
  if (nev && to.dataset.de !== String(nev.de)) { to.dataset.de = String(nev.de); to.innerHTML = nev.html; }
  to.style.transform = `translateY(${-(1 - nk) * 160}%)`; to.style.visibility = nk > 0.001 ? "visible" : "hidden";
  // estados que mudam com um toque
  EV.trocas.forEach((x) => { const e = document.querySelector(x.sel); if (e) { const d = t >= x.t; if (e.dataset.d !== String(d)) { e.dataset.d = String(d); x.fn(e, d); } } });
  // o dedo
  const dedo = document.getElementById("dedo"); let op = 0;
  for (const tq of EV.toques) { const dt = t - tq.t, dur = Math.max(0.35, tq.segura);
    if (dt > -0.5 && dt < dur + 0.25) { const alvo = document.querySelector(tq.alvo); if (!alvo) continue; const r = alvo.getBoundingClientRect();
      if (r.width === 0) continue;
      dedo.style.left = (r.left + Math.min(r.width / 2, 260) - 46) + "px"; dedo.style.top = (r.top + r.height / 2 - 46) + "px";
      if (dt < 0) { op = clamp(1 + dt / 0.5); dedo.style.transform = `scale(${1.35 - 0.35 * op})`; }
      else if (dt < dur) { op = 1; dedo.style.transform = `scale(${tq.segura ? 0.8 + 0.25 * Math.sin(dt * 9) * 0.3 + 0.1 * (dt / dur) : 0.85})`; }
      else { op = clamp(1 - (dt - dur) / 0.25); dedo.style.transform = `scale(${0.9 + (dt - dur)})`; } } }
  dedo.style.opacity = op;
  // celular entra e sai; rotulo de quem e' o celular
  const tEntra = w("intro", "server") - 0.3, tSai = ini("cta") - 0.2;
  const fe = easeOut(clamp((t - tEntra) / 0.6)), fs = easeOut(clamp((t - tSai) / 0.5));
  vis(F, fe * (1 - fs), (1 - fe) * 220 + fs * 220, 1);
  const r = ultimo(EV.rotulos, t), et = document.getElementById("etiqueta"), sp = et.firstElementChild;
  sp.textContent = r.texto; sp.className = r.budi ? "budi" : "";
  const pop = r.t > 0 ? easeOut(clamp((t - r.t) / 0.35)) : 1;
  vis(et, fe * (1 - fs), 0, 0.85 + 0.15 * pop);
  // abertura e fechamento
  const fi = easeOut(clamp((t - 0.1) / 0.6)) * (1 - easeOut(clamp((t - tEntra) / 0.4)));
  vis(document.getElementById("intro"), fi, Math.sin(t * 2.2) * 8, 0.9 + 0.1 * fi);
  const fcta = easeOut(clamp((t - ini("cta")) / 0.6));
  vis(document.getElementById("cta"), fcta, (1 - fcta) * 120 + Math.sin(t * 3) * 6, 1);
  legenda(t);
}

function legenda(t) {
  const L = document.getElementById("legenda");
  const c = TL.cenas.find((x) => t >= x.inicio - 0.05 && t <= x.fim + 0.25);
  if (!c || !c.palavras.length) { L.innerHTML = ""; return; }
  const grupos = []; let a = [];
  for (const p of c.palavras) { a.push(p); if (p.quebra || a.length === 5) { grupos.push(a); a = []; } }
  if (a.length) grupos.push(a);
  let g = grupos.findIndex((gr) => t < gr[gr.length - 1].t1 + 0.08); if (g < 0) g = grupos.length - 1;
  const chave = c.id + ":" + g;
  if (L.dataset.chave !== chave) { L.dataset.chave = chave; L.innerHTML = grupos[g].map((p) => `<span>${p.texto}</span>`).join(" "); }
  [...L.children].forEach((s, i) => { const p = grupos[g][i]; const agora = t >= p.t0 - 0.02 && t < p.t1 + 0.05;
    s.className = agora ? "agora" : ""; s.style.transform = `scale(${agora ? 1.08 : 1})`; });
}
