# Publica o site da CYRON em hicyron.github.io.
#
# O site é escrito na pasta cyron/ DESTE repositório, junto com o bot
# (discord-bot-gateway/). Até outubro de 2026 tudo morava em
# portal-alianca/portal-alianca.github.io e este workflow buscava a pasta de
# lá a cada 10 minutos; agora a fonte é aqui, e ele roda quando cyron/ muda.
#
# CACHE: o GitHub Pages deixa o navegador guardar cada arquivo por 10 min,
# e o celular às vezes mais. Para ninguém ficar preso numa versão velha de
# script, CSS ou imagem, cada endereço local desses dentro dos .html ganha
# ?v=<versão> na hora de publicar: mudou o site, mudou o endereço, e o
# navegador é obrigado a baixar de novo. Na fonte ninguém precisa lembrar
# de trocar número nenhum.

name: Publicar o site

on:
  push:
    branches: [main]
    paths:
      - "cyron/**"
      - ".github/workflows/publicar.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: cyron

      - name: montar a pasta (e carimbar a versão nos endereços)
        env:
          VERSAO: ${{ github.sha }}
        run: |
          mkdir site
          cp -r cyron/. site/
          touch site/.nojekyll
          echo "$VERSAO" > site/versao.txt
          curta="${VERSAO:0:8}"
          # src="./x.js", href="./x.css", imagens e vídeos: troca (ou põe) o ?v=.
          find site -name '*.html' -print0 | xargs -0 sed -i -E \
            "s~((src|href)=\"\./[^\"?#]+\.(js|css|png|jpe?g|webp|svg|mp4))(\?v=[^\"#]*)?\"~\1?v=${curta}\"~g"
          grep -ho 'casca\.js?v=[a-z0-9]*' site/*.html | sort -u

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
