<!doctype html>
<html lang="pt-BR" class="casca">
<head>
<script>/* endereço antigo → hicyron.github.io (mesma página, mesmos parâmetros) */
if (location.hostname === "portal-alianca.github.io") location.replace("https://hicyron.github.io" + location.pathname.replace(/^\/cyron/, "") + location.search + location.hash);
</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CYRON — meus servidores</title>
<meta name="robots" content="noindex">
<link rel="icon" href="./img/cyron.png">
<style>
:root{
  --fundo:#0F1115; --fundo-2:#161A21; --fundo-3:#1D222B;
  --borda:#272D38; --borda-viva:#3A424F;
  --texto:#E8EAED; --texto-fraco:#9AA3AF; --texto-fraquinho:#6B7482;
  --ambar:#7B8CFF; --verde:#5EBB83; --azul:#5865F2; --amarelo:#F0B232; --vermelho:#E06A5A; --link:#58B2F0;
  --raio:14px;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--fundo); color:var(--texto);
  font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
a{color:var(--ambar); text-decoration:none}
a:hover{text-decoration:underline}
.env{max-width:1040px; margin:0 auto; padding:0 20px}
.barra{background:rgba(15,17,21,.86); backdrop-filter:blur(8px); border-bottom:1px solid var(--borda); position:sticky; top:0; z-index:9}
.barra .env{display:flex; align-items:center; gap:16px; height:62px}
.marca{font-weight:700; letter-spacing:.12em; font-size:15px; color:var(--texto)}
.marca span{color:var(--ambar)}
.barra nav{margin-left:auto; display:flex; align-items:center; gap:12px}
.barra nav a{color:var(--texto-fraco); font-size:14px; white-space:nowrap}
.eu{display:flex; align-items:center; gap:10px; font-size:14px; color:var(--texto-fraco)}
.eu img{width:26px; height:26px; border-radius:50%}

h1{font-size:27px; letter-spacing:-.015em; margin:0}
.sub{color:var(--texto-fraco); margin:10px 0 0; font-size:15px}
main{padding:40px 0 80px}

.bt{
  display:inline-flex; align-items:center; justify-content:center; gap:9px;
  padding:13px 22px; border-radius:11px; font-weight:650; font-size:15px;
  border:1px solid transparent; cursor:pointer; font-family:inherit; text-align:center;
}
.bt:hover{text-decoration:none; filter:brightness(1.08)}
.bt-1{background:var(--azul); color:#fff}
.bt-2{background:var(--fundo-3); color:var(--texto); border-color:var(--borda-viva)}
.bt-3{background:var(--ambar); color:#191427}
.bt-p{padding:9px 15px; font-size:14px; border-radius:9px}
.centro{text-align:center; padding:66px 0}
.centro p{color:var(--texto-fraco); max-width:460px; margin:14px auto 28px}

/* ---- selos de plano ---- */
.cracha{font-size:11px; font-weight:750; letter-spacing:.06em; text-transform:uppercase; padding:4px 10px; border-radius:999px; white-space:nowrap}
.c-pago{background:rgba(123,140,255,.14); color:var(--ambar); border:1px solid rgba(123,140,255,.32)}
.c-teste{background:rgba(94,187,131,.15); color:var(--verde); border:1px solid rgba(94,187,131,.32)}
.c-gratis{background:var(--fundo-3); color:var(--texto-fraco); border:1px solid var(--borda-viva)}

/* ---- grade de servidores ---- */
.grade{display:grid; grid-template-columns:repeat(auto-fill,minmax(270px,1fr)); gap:14px; margin-top:28px}
.cartao{
  background:var(--fundo-2); border:1px solid var(--borda); border-radius:var(--raio);
  padding:18px; text-align:left; display:block; color:inherit; transition:border-color .15s, transform .15s;
}
.cartao:hover{text-decoration:none; border-color:var(--borda-viva); transform:translateY(-1px)}
.cartao.fora{opacity:.66}
.cab{display:flex; align-items:center; gap:13px}
.icone{
  width:46px; height:46px; border-radius:13px; flex:0 0 46px; object-fit:cover;
  background:var(--fundo-3); display:flex; align-items:center; justify-content:center;
  font-weight:700; color:var(--texto-fraco); font-size:17px;
}
.icone.g{width:72px;height:72px;flex-basis:72px;border-radius:19px;font-size:26px}
.nome{min-width:0; flex:1}
.nome b{display:block; font-size:16px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.nome small{color:var(--texto-fraco); font-size:13px}
.tiras{display:flex; gap:16px; margin-top:16px; padding-top:15px; border-top:1px solid var(--linha,#20242d)}
.tira{min-width:0}
.tira b{display:block; font-size:19px; font-weight:700; letter-spacing:-.01em}
.tira small{color:var(--texto-fraquinho); font-size:11.5px; text-transform:uppercase; letter-spacing:.04em}
.spark{display:flex; align-items:flex-end; gap:3px; height:30px; margin-top:16px}
.spark i{flex:1; background:linear-gradient(180deg,var(--ambar),#4b56c9); border-radius:3px 3px 0 0; min-height:2px; opacity:.85}
.cartao .acao{margin-top:16px}

/* ---- detalhe do servidor ---- */
.voltar{margin:0 0 14px; font-size:14px}
.topo-srv{display:flex; align-items:center; gap:18px; flex-wrap:wrap}
.topo-srv .nome b{font-size:24px}
.painel-stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-top:26px}
.stat{background:var(--fundo-2); border:1px solid var(--borda); border-radius:var(--raio); padding:18px 20px}
.stat .n{font-size:28px; font-weight:750; letter-spacing:-.02em}
.stat .r{color:var(--texto-fraco); font-size:13px; margin-top:3px}
.stat .r b{color:var(--verde); font-weight:700}
.bloco{background:var(--fundo-2); border:1px solid var(--borda); border-radius:var(--raio); padding:20px 22px; margin-top:16px}
.bloco h2{font-size:14px; text-transform:uppercase; letter-spacing:.05em; color:var(--texto-fraco); margin:0 0 16px; font-weight:700}
.barras{display:flex; align-items:flex-end; gap:8px; height:120px}
.col{flex:1; display:flex; flex-direction:column; align-items:center; gap:7px; min-width:0}
.col .haste{width:100%; max-width:34px; background:linear-gradient(180deg,var(--ambar),#434ebb); border-radius:5px 5px 0 0; min-height:3px; position:relative}
.col .haste:hover::after{content:attr(data-v); position:absolute; bottom:100%; left:50%; transform:translateX(-50%); background:var(--fundo-3); border:1px solid var(--borda-viva); border-radius:6px; padding:2px 7px; font-size:12px; white-space:nowrap; margin-bottom:5px}
.col small{color:var(--texto-fraquinho); font-size:11px; white-space:nowrap}
.botoes-servidor{display:flex; gap:10px; margin:22px 0 0; flex-wrap:wrap}

.aviso{padding:16px 18px; border-radius:var(--raio); background:var(--fundo-2); border-left:3px solid var(--vermelho); color:var(--texto-fraco); font-size:15px; margin-top:24px}
.aviso.calmo{border-left-color:var(--borda-viva)}
.carregando{color:var(--texto-fraco); text-align:center; padding:60px 0}
.indisponivel{font-size:13.5px; color:var(--texto-fraco); font-style:italic}

footer{border-top:1px solid var(--borda); padding:26px 0; color:var(--texto-fraco); font-size:14px}
footer .env{display:flex; gap:18px; flex-wrap:wrap; align-items:center}
footer nav{margin-left:auto; display:flex; gap:18px; flex-wrap:wrap}
[data-en]{display:none}
html[lang="en"] [data-pt]{display:none}
html[lang="en"] [data-en]{display:revert}
.conta-barra{display:flex; align-items:center; gap:8px; flex-wrap:wrap; justify-content:flex-end; font-size:13px; color:var(--texto-fraco); margin:0 0 20px}
.conta-barra span{margin-right:auto}
.conta-barra .bt{padding:6px 12px; font-size:13px}
</style>

<main class="env">
  <div id="tela"><div class="carregando"><span data-pt>Um instante…</span><span data-en>One moment…</span></div></div>
</main>

<footer><div class="env">
  <span>CYRON</span>
  <nav>
    <a href="./privacidade.html"><span data-pt>Privacidade</span><span data-en>Privacy</span></a>
    <a href="./termos.html"><span data-pt>Termos de uso</span><span data-en>Terms of use</span></a>
  </nav>
</div></footer>

<script>
var CLIENT_ID = "1498142929041096856";
var PERMISSOES = "327223209040";
var FUNCAO = "https://mslzcjqkfeivuavfxwli.supabase.co/functions/v1/cyron-entrar";
var CONVITE = "https://discord.com/oauth2/authorize?client_id=" + CLIENT_ID +
  "&permissions=" + PERMISSOES + "&scope=bot%20applications.commands";

/* O endereço de volta não pode carregar a query, senão o `code` de um login
   anterior entraria no `redirect_uri` do próximo e o Discord recusaria. */
var VOLTA = location.origin + location.pathname;
var tela = document.getElementById("tela");

if ((navigator.language || "pt").toLowerCase().indexOf("pt") !== 0) {
  document.documentElement.lang = "en";
}
function pt(a, b) { return document.documentElement.lang === "en" ? b : a; }
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}
function num(n) {
  try { return Number(n || 0).toLocaleString(pt("pt-BR", "en-US")); }
  catch (e) { return String(n || 0); }
}

/* ---------------- entrar ---------------- */
function sortear() {
  var b = new Uint8Array(16);
  crypto.getRandomValues(b);
  return Array.prototype.map.call(b, function (n) { return n.toString(16).padStart(2, "0"); }).join("");
}
function entrar() {
  var estado = sortear();
  try { sessionStorage.setItem("cyron-volta", servidorDoEndereco()); } catch (e) { /* segue sem */ }
  try { sessionStorage.setItem("cyron-estado", estado); }
  catch (e) {
    return mostrarErro(pt(
      "Seu navegador está bloqueando o armazenamento da aba, e sem ele eu não consigo fazer o login com segurança. Saia do modo privado ou libere os dados deste site.",
      "Your browser is blocking session storage, and without it I can't log you in safely. Leave private mode or allow site data."));
  }
  location.href = "https://discord.com/oauth2/authorize" +
    "?client_id=" + CLIENT_ID + "&response_type=code" +
    "&scope=" + encodeURIComponent("identify guilds") +
    "&state=" + estado +
    "&redirect_uri=" + encodeURIComponent(VOLTA);
}

function telaDeEntrada() {
  tela.innerHTML =
    '<div class="centro">' +
      '<h1>' + pt("Seu painel CYRON", "Your CYRON panel") + '</h1>' +
      '<p>' + pt(
        "Entre com o Discord para ver os servidores que você administra, as estatísticas de tradução, o plano de cada um e o seu Estúdio.",
        "Sign in with Discord to see the servers you manage, translation stats, each one's plan, and your Studio.") + '</p>' +
      '<button class="bt bt-1" id="entrar">' + pt("Entrar com Discord", "Sign in with Discord") + '</button>' +
      '<div class="aviso calmo" style="margin-top:34px;text-align:left">' + pt(
        "Eu peço só duas coisas ao Discord: quem é você e a lista dos seus servidores. Não peço acesso a mensagem nenhuma, e devolvo a autorização assim que termino de montar esta tela.",
        "I ask Discord for two things only: who you are and the list of your servers. I don't ask for access to any message, and I hand the authorization back as soon as this screen is built.") +
      '</div>' +
    '</div>';
  document.getElementById("entrar").addEventListener("click", entrar);
}
function mostrarErro(texto, comBotao) {
  tela.innerHTML =
    '<div class="centro">' +
      '<h1>' + pt("Não deu certo", "That didn't work") + '</h1>' +
      '<div class="aviso" style="text-align:left">' + esc(texto) + '</div>' +
      (comBotao === false ? "" :
        '<button class="bt bt-2" id="devolta" style="margin-top:26px">' + pt("Tentar de novo", "Try again") + '</button>') +
    '</div>';
  var b = document.getElementById("devolta");
  if (b) b.addEventListener("click", function () { location.href = VOLTA; });
}

/* ---------------- peças da tela ---------------- */
function quando(iso) {
  if (!iso) return "";
  try { return new Date(iso).toLocaleDateString(pt("pt-BR", "en-US")); }
  catch (e) { return ""; }
}
function iconeDe(s, grande) {
  var inicial = esc((s.nome || "?").trim().charAt(0).toUpperCase());
  return s.icone
    ? '<img class="icone' + (grande ? " g" : "") + '" src="' + esc(s.icone) + '" alt="">'
    : '<div class="icone' + (grande ? " g" : "") + '">' + inicial + "</div>";
}
function crachaDe(s) {
  if (!s.instalado) return '<span class="cracha c-gratis">' + pt("sem o bot", "not installed") + "</span>";
  if (s.plano === "pago") {
    return s.motivo === "teste"
      ? '<span class="cracha c-teste">' + pt("teste", "trial") + "</span>"
      : '<span class="cracha c-pago">' + (s.nivel === "pro" ? "Pro" : pt("Aliança", "Alliance")) + "</span>";
  }
  return '<span class="cracha c-gratis">' + pt("grátis", "free") + "</span>";
}
function detalheDe(s) {
  if (!s.instalado) return pt("A CYRON ainda não está aqui", "CYRON isn't here yet");
  if (s.plano === "pago") {
    var ate = quando(s.ate);
    if (s.motivo === "teste") return pt("Teste até " + ate, "Trial until " + ate);
    return ate ? pt("Pago até " + ate, "Paid through " + ate) : pt("Liberado sem prazo", "Enabled with no end date");
  }
  return pt("Plano grátis", "Free plan");
}
function acaoDe(s, px) {
  var c = "bt bt-3" + (px ? " bt-p" : "");
  if (!s.instalado) return '<a class="bt bt-2' + (px ? " bt-p" : "") + '" href="' + CONVITE + '">' + pt("Adicionar", "Add") + "</a>";
  if (s.plano === "pago") return s.pagar ? '<a class="' + c + '" href="' + esc(s.pagar) + '">' + pt("Assinar", "Subscribe") + "</a>" : "";
  if (s.pagar || s.pagarPro) {
    return (s.pagarPro ? '<a class="' + c + '" href="' + esc(s.pagarPro) + '">' + pt("Pro R$ 29,90/mês", "Pro $6/mo") + "</a> " : "") +
           (s.pagar ? '<a class="' + c + '" href="' + esc(s.pagar) + '">' + pt("Aliança R$ 79/mês", "Alliance $15/mo") + "</a>" : "");
  }
  return '<span class="indisponivel">' + pt("Assinatura em breve", "Subscription soon") + "</span>";
}
function sparkline(dias7) {
  if (!dias7 || !dias7.length) return "";
  var topo = Math.max.apply(null, dias7.map(function (d) { return d.t; }).concat([1]));
  return '<div class="spark">' + dias7.map(function (d) {
    return '<i style="height:' + Math.round((d.t / topo) * 100) + '%"></i>';
  }).join("") + "</div>";
}
function somaSemana(dias7) {
  return (dias7 || []).reduce(function (a, d) { return a + (d.t || 0); }, 0);
}

/* cartão de servidor na grade.

   Instalado: o card INTEIRO é um link para o detalhe (#g=). Sem o bot: é um
   div com o botão "Adicionar" — um <a> dentro de outro <a> o navegador quebra,
   e a instalação não tem detalhe para abrir. */
function cartaoServidor(s) {
  var cab = '<div class="cab">' + iconeDe(s) +
    '<div class="nome"><b>' + esc(s.nome) + "</b><small>" + detalheDe(s) + "</small></div>" + crachaDe(s) + "</div>";
  if (!s.instalado) {
    return '<div class="cartao fora">' + cab + '<div class="acao">' + acaoDe(s, true) + "</div></div>";
  }
  var st = s.stats, corpo = "";
  if (st) {
    corpo =
      '<div class="tiras">' +
        '<div class="tira"><b>' + num(st.traducoes) + "</b><small>" + pt("traduções", "translations") + "</small></div>" +
        '<div class="tira"><b>' + num(st.idiomas) + "</b><small>" + pt("idiomas", "languages") + "</small></div>" +
        '<div class="tira"><b>' + num(st.salas) + "</b><small>" + pt("salas", "rooms") + "</small></div>" +
      "</div>" + sparkline(st.dias7);
  }
  return '<a class="cartao" href="#g=' + esc(s.guild_id) + '">' + cab + corpo + "</a>";
}

/* chaveEstudio: guardada do último login, para o botão do Estúdio */
var CHAVE_ESTUDIO = "";

function telaDoServidor(s, quando_) {
  var discord = "https://discord.com/channels/" + encodeURIComponent(s.guild_id);
  var st = s.stats;
  var html =
    '<p class="voltar"><a href="#">← ' + pt("Todos os servidores", "All servers") + "</a></p>" +
    '<div class="topo-srv">' + iconeDe(s, true) +
      '<div class="nome" style="flex:1 1 200px"><b>' + esc(s.nome) + "</b><small>" + detalheDe(s) + "</small></div>" +
      crachaDe(s) + " " + acaoDe(s, true) +
    "</div>";

  if (s.instalado && st) {
    html +=
      '<div class="painel-stats">' +
        '<div class="stat"><div class="n">' + num(st.traducoes) + '</div><div class="r">' + pt("traduções no total", "translations total") + "</div></div>" +
        '<div class="stat"><div class="n">' + num(somaSemana(st.dias7)) + '</div><div class="r">' + pt("nos últimos 7 dias", "in the last 7 days") + "</div></div>" +
        '<div class="stat"><div class="n">' + num(st.idiomas) + '</div><div class="r">' + pt("idiomas ativos", "active languages") + "</div></div>" +
        '<div class="stat"><div class="n">' + num(st.salas) + '</div><div class="r">' + pt("salas de tradução", "translation rooms") + "</div></div>" +
        '<div class="stat"><div class="n">' + num(st.cache) + '</div><div class="r">' +
          (st.cache ? "<b>" + pt("economizadas", "saved") + "</b> " + pt("pelo cache", "by cache") : pt("do cache", "from cache")) + "</div></div>" +
      "</div>" +
      graficoSemana(st.dias7);
  }

  html += '<div class="botoes-servidor">';
  if (s.instalado && CHAVE_ESTUDIO) html += '<a class="bt bt-1" href="./estudio.html#t=' + encodeURIComponent(CHAVE_ESTUDIO) + '">🎨 ' + pt("Meu Estúdio", "My Studio") + "</a>";
  html += '<a class="bt bt-2" href="' + discord + '">' + pt("Abrir no Discord", "Open in Discord") + "</a></div>";

  if (s.instalado) {
    html += '<div class="aviso calmo">' + pt(
      "Idiomas, salas e chaves deste servidor se ajustam pelo próprio Discord: use /cyron no servidor. Em breve dá para controlar por aqui também.",
      "Languages, rooms and keys for this server are set inside Discord: use /cyron there. Soon you'll be able to control it here too.") + "</div>";
  }

  tela.innerHTML = html;
  setTimeout(function () { barraDaConta(quando_); }, 0);
}

function graficoSemana(dias7) {
  if (!dias7 || !dias7.length) return "";
  var topo = Math.max.apply(null, dias7.map(function (d) { return d.t; }).concat([1]));
  var dias = pt(["dom","seg","ter","qua","qui","sex","sáb"], ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"]);
  var cols = dias7.map(function (d) {
    var dia = new Date(d.d + "T00:00:00Z").getUTCDay();
    var alt = Math.max(3, Math.round((d.t / topo) * 100));
    return '<div class="col"><div class="haste" data-v="' + num(d.t) + '" style="height:' + alt + '%"></div><small>' + dias[dia] + "</small></div>";
  }).join("");
  return '<div class="bloco"><h2>' + pt("Traduções por dia · última semana", "Translations per day · last week") + '</h2><div class="barras">' + cols + "</div></div>";
}

/* ---------------- a lista e o cache ---------------- */
var VALE_POR = 24 * 3600e3;
function lerGuardado() {
  try {
    var g = JSON.parse(localStorage.getItem("cyron-painel") || "null");
    if (g && g.dados && Date.now() - g.quando < VALE_POR) return g;
  } catch (e) { /* modo privado */ }
  return null;
}
function sair() {
  try { localStorage.removeItem("cyron-painel"); localStorage.removeItem("cyron-conta"); } catch (e) { /* idem */ }
  location.href = "./";
}
function haQuanto(ms) {
  var min = Math.max(1, Math.round((Date.now() - ms) / 60000));
  if (min < 60) return pt("há " + min + " min", min + " min ago");
  var h = Math.round(min / 60);
  return pt("há " + h + " h", h + " h ago");
}
var ULTIMO = null;
function servidorDoEndereco() {
  var m = /^#g=(\d{5,25})$/.exec(location.hash || "");
  return m ? m[1] : "";
}

function mostrar(dados, quando_) {
  ULTIMO = [dados, quando_];
  if (dados.estudio_chave) CHAVE_ESTUDIO = dados.estudio_chave;
  var u = dados.usuario || {};
  if (!quando_) {
    try { localStorage.setItem("cyron-painel", JSON.stringify({ quando: Date.now(), dados: dados })); }
    catch (e) { /* modo privado */ }
  }
  try {
    localStorage.setItem("cyron-conta", JSON.stringify({
      quando: Date.now(), nome: u.nome || "", avatar: u.avatar || "",
      servidores: (dados.servidores || []).map(function (s) {
        return { id: s.guild_id || "", nome: s.nome || "", icone: s.icone || "", instalado: !!s.instalado };
      }),
    }));
  } catch (e) { /* modo privado */ }
  var eu = document.getElementById("eu");
  eu.hidden = false;
  eu.innerHTML = (u.avatar ? '<img src="' + esc(u.avatar) + '" alt="">' : "") + esc(u.nome);

  var lista = dados.servidores || [];
  if (!lista.length) {
    tela.innerHTML =
      '<h1>' + pt("Seus servidores", "Your servers") + "</h1>" +
      '<p class="sub">' + pt(
        "Não encontrei nenhum servidor em que você tenha permissão de gerenciar.",
        "I found no server where you have Manage Server permission.") + "</p>" +
      '<div class="centro"><a class="bt bt-1" href="' + CONVITE + '">' +
        pt("Adicionar a CYRON a um servidor", "Add CYRON to a server") + "</a></div>";
    return;
  }

  var escolhido = servidorDoEndereco();
  var este = escolhido && lista.filter(function (s) { return String(s.guild_id) === escolhido; })[0];
  if (este) return telaDoServidor(este, quando_);

  var comBot = lista.filter(function (s) { return s.instalado; }).length;
  setTimeout(function () { barraDaConta(quando_); }, 0);
  tela.innerHTML =
    '<h1>' + pt("Seus servidores", "Your servers") + "</h1>" +
    '<p class="sub">' + (comBot
      ? pt("A CYRON está em " + comBot + " deles. Toque para ver as estatísticas.", "CYRON is in " + comBot + " of them. Tap to see stats.")
      : pt("A CYRON ainda não está em nenhum deles.", "CYRON isn't in any of them yet.")) + "</p>" +
    '<div class="grade">' + lista.map(cartaoServidor).join("") + "</div>" +
    '<div class="aviso calmo">' + pt(
      "Para cancelar ou trocar o cartão, use o recibo que o Stripe mandou por e-mail — o link de gerenciar assinatura está lá.",
      "To cancel or change your card, use the receipt Stripe emailed you — the manage-subscription link is in it.") + "</div>";
}

function barraDaConta(quando_) {
  var barra = document.createElement("div");
  barra.className = "conta-barra";
  barra.innerHTML = '<span>' + pt("Atualizado ", "Updated ") + haQuanto(quando_ || Date.now()) + "</span>" +
    '<button type="button" class="bt bt-2" id="atualizar">🔄 ' + pt("Atualizar", "Refresh") + "</button>" +
    '<button type="button" class="bt bt-2" id="sair">' + pt("Sair", "Sign out") + "</button>";
  tela.insertBefore(barra, tela.firstChild);
  document.getElementById("atualizar").addEventListener("click", entrar);
  document.getElementById("sair").addEventListener("click", sair);
}

window.addEventListener("hashchange", function () {
  if (ULTIMO) { mostrar(ULTIMO[0], ULTIMO[1]); window.scrollTo(0, 0); }
  else location.reload();
});

function trocar(code) {
  fetch(FUNCAO, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ code: code, redirect_uri: VOLTA }),
  })
    .then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (j) {
        if (!r.ok) throw new Error(j.erro || pt("erro " + r.status, "error " + r.status));
        return j;
      });
    })
    .then(function (dados) {
      var g = "";
      try { g = sessionStorage.getItem("cyron-volta") || ""; sessionStorage.removeItem("cyron-volta"); } catch (e) { /* idem */ }
      if (g) history.replaceState(null, "", VOLTA + "#g=" + g);
      mostrar(dados);
    })
    .catch(function (e) { mostrarErro(e.message || pt("Falhei ao falar com o servidor.", "Failed to reach the server.")); });
}

(function () {
  var q = new URLSearchParams(location.search);
  var code = q.get("code");
  var estado = q.get("state");

  if (q.get("error")) {
    history.replaceState(null, "", VOLTA);
    return telaDeEntrada();
  }
  if (!code) {
    var g = lerGuardado();
    if (q.get("entrar") === "1") history.replaceState(null, "", VOLTA);
    if (g) return mostrar(g.dados, g.quando);
    if (q.get("entrar") === "1") return entrar();
    return telaDeEntrada();
  }

  var guardado = null;
  try { guardado = sessionStorage.getItem("cyron-estado"); } catch (e) { /* modo privado */ }
  try { sessionStorage.removeItem("cyron-estado"); } catch (e) { /* idem */ }

  if (!estado || !guardado || estado !== guardado) {
    history.replaceState(null, "", VOLTA);
    return telaDeEntrada();
  }
  history.replaceState(null, "", VOLTA);
  trocar(code);
})();
</script>
